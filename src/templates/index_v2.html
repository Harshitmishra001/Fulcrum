<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fulcrum - Workspace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Inter:wght@300;400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "on-surface-variant": "#5f5f61",
              "secondary": "#5e5f65",
              "on-error-container": "#752121",
              "surface-container-high": "#eae7ea",
              "primary-dim": "#4e5260",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#5a5b61",
              "surface-container": "#f0edef",
              "on-tertiary-fixed-variant": "#5b5672",
              "tertiary-dim": "#54506b",
              "on-secondary-fixed": "#3e3f45",
              "inverse-surface": "#0e0e0f",
              "error-dim": "#4e0309",
              "inverse-on-surface": "#9e9c9d",
              "on-tertiary": "#fcf7ff",
              "outline": "#7b7a7d",
              "on-error": "#fff7f6",
              "primary-container": "#dfe2f2",
              "surface": "#fcf8f9",
              "tertiary-fixed-dim": "#d4cdee",
              "surface-variant": "#e4e2e5",
              "on-background": "#323235",
              "surface-bright": "#fcf8f9",
              "secondary-container": "#e2e2e9",
              "tertiary-container": "#e3dbfd",
              "error-container": "#fe8983",
              "background": "#fcf8f9",
              "primary": "#5a5e6c",
              "surface-container-low": "#f6f3f4",
              "secondary-fixed-dim": "#d4d4db",
              "primary-fixed": "#dfe2f2",
              "on-secondary-container": "#505157",
              "inverse-primary": "#eaedfe",
              "tertiary": "#605c78",
              "surface-dim": "#dbd9dd",
              "primary-fixed-dim": "#d0d4e4",
              "on-tertiary-fixed": "#3e3a54",
              "secondary-fixed": "#e2e2e9",
              "outline-variant": "#b3b1b4",
              "error": "#9f403d",
              "tertiary-fixed": "#e3dbfd",
              "on-primary-fixed": "#3b3f4c",
              "on-primary": "#f7f7ff",
              "surface-container-highest": "#e4e2e5",
              "surface-tint": "#5a5e6c",
              "on-secondary": "#f9f8ff",
              "on-primary-container": "#4d515f",
              "on-surface": "#323235",
              "on-primary-fixed-variant": "#575b69",
              "on-tertiary-container": "#514d68"
            },
            "fontFamily": {
              "headline": "Literata",
              "body": "Inter",
              "label": "Public Sans"
            }
          }
        }
      }
</script>
<style>
    body { background-color: #fcf8f9; }
    .border-border { border-color: #E2E8F0; }
</style>
</head>
<body class="bg-background text-on-background h-screen flex flex-col font-body antialiased overflow-hidden">
<div class="flex h-full w-full">

<!-- Side Navigation -->
<aside class="w-64 border-r border-border bg-surface flex flex-col shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-border">
        <h1 class="font-headline font-bold tracking-tight text-lg text-slate-900 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">scale</span> Fulcrum
        </h1>
    </div>
    <nav class="p-4 space-y-1 flex-1">
        <a class="flex items-center gap-3 px-3 py-2 rounded-md bg-primary-container text-on-primary-container font-semibold text-sm transition-colors" href="#">
            <span class="material-symbols-outlined text-[20px]">dashboard</span> Workspace
        </a>
        <a class="flex items-center gap-3 px-3 py-2 rounded-md text-on-surface hover:bg-surface-variant font-medium text-sm transition-colors opacity-80" href="#">
            <span class="material-symbols-outlined text-[20px]">upload_file</span> Ingestion History
        </a>
    </nav>
    <div class="p-4 border-t border-border">
        <div class="flex items-center gap-2 text-xs font-label text-on-surface-variant font-medium uppercase tracking-wider">
            <div class="w-2 h-2 rounded-full bg-green-500"></div> System Health: 99.8%
        </div>
    </div>
</aside>

<main class="flex-1 flex overflow-hidden">
    <!-- Ingestion Panel (Left) -->
    <section class="w-[300px] border-r border-border bg-slate-50 shrink-0 flex flex-col">
        <div class="h-16 flex items-center px-4 border-b border-border">
            <h2 class="font-headline font-semibold text-slate-900 uppercase tracking-wide text-sm">Document Ingestion</h2>
        </div>
        
        <div class="p-4 border-b border-border bg-white">
            <form id="uploadForm" class="flex flex-col gap-3">
                <input type="file" id="fileInput" name="file" accept="application/pdf" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 transition border border-border rounded p-1">
                <button type="submit" id="uploadBtn" class="w-full px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold uppercase tracking-wider rounded transition flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">upload</span> Process PDF
                </button>
            </form>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <div id="jobStatusContainer" class="hidden rounded border border-border bg-white p-3 shadow-[0_1px_2px_0_rgba(0,0,0,0.05)]">
                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-indigo-500 text-[20px] animate-pulse">hourglass_empty</span>
                    <div class="flex-1">
                        <p class="text-xs font-mono font-semibold text-slate-900 mb-1 truncate" id="jobDocName">Document.pdf</p>
                        <p class="text-[10px] text-slate-500 mb-2 uppercase tracking-wide font-label" id="jobStatusText">Processing (0%)</p>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-indigo-500 h-1.5 rounded-full w-1/3 animate-pulse" id="jobProgressBar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Center/Right Area -->
    <div class="flex-1 flex flex-col overflow-hidden bg-white relative">
        <header class="h-16 flex items-center justify-between px-6 border-b border-border bg-white shrink-0">
            <h2 class="font-headline font-semibold text-slate-900 uppercase tracking-wide text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">account_tree</span> Investigation Feed
            </h2>
            <div class="text-xs font-label text-slate-500 uppercase tracking-wider border border-border px-2 py-1 rounded bg-slate-50 font-bold" id="relCount">0 Pairs</div>
        </header>

        <section class="flex-1 overflow-y-auto bg-slate-50 relative">
            <div class="p-6 space-y-6 max-w-5xl mx-auto" id="relationsList">
                <!-- Relations inject here -->
            </div>
        </section>

        <!-- Quarantine Section (Bottom) -->
        <section class="h-[250px] border-t border-border bg-white flex flex-col shrink-0 relative">
            <div class="p-3 border-b border-border bg-slate-50 flex justify-between items-center z-10 sticky top-0">
                <h3 class="font-headline font-semibold text-sm text-slate-900 uppercase tracking-wide flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px] text-red-600">bug_report</span>
                    Malformed Tables Quarantined
                </h3>
                <span class="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-0.5 rounded border border-red-200" id="failCount">0 Items</span>
            </div>
            <div class="flex-1 overflow-auto">
                <table class="w-full text-left border-collapse font-body text-xs text-slate-900">
                    <thead class="sticky top-0 bg-white border-b border-border z-10 shadow-[0_1px_0_0_#E2E8F0]">
                        <tr>
                            <th class="py-2 px-4 font-bold font-label text-on-surface-variant uppercase text-[10px] tracking-wider">Document Name</th>
                            <th class="py-2 px-4 font-bold font-label text-on-surface-variant uppercase text-[10px] tracking-wider">Page</th>
                            <th class="py-2 px-4 font-bold font-label text-on-surface-variant uppercase text-[10px] tracking-wider">Reason</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-border" id="failuresList">
                        <!-- Failures inject here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</div>

<script>
    async function loadData() {
        try {
            // Load Relations
            const res = await fetch('/api/relations');
            const data = await res.json();
            
            const resFacts = await fetch('/api/facts');
            const dataFacts = await resFacts.json();
            const factMap = {};
            dataFacts.facts.forEach(f => factMap[f.id] = f);

            const list = document.getElementById('relationsList');
            list.innerHTML = '';
            document.getElementById('relCount').innerText = `${data.relations.length} Pairs`;

            data.relations.forEach(r => {
                const fA = factMap[r.fact_a_id];
                const fB = factMap[r.fact_b_id];
                if (!fA || !fB) return;

                let relColorClass = 'border-slate-300 bg-white';
                let headerBgClass = 'bg-slate-100 border-slate-300';
                let textColorClass = 'text-slate-700';
                let icon = 'sync_alt';

                if (r.relation_type === 'corroboration') {
                    relColorClass = 'border-green-300 bg-white';
                    headerBgClass = 'bg-green-50 border-green-200';
                    textColorClass = 'text-green-700';
                    icon = 'verified';
                } else if (r.relation_type === 'contradiction') {
                    relColorClass = 'border-red-300 bg-white shadow-sm';
                    headerBgClass = 'bg-red-50 border-red-200';
                    textColorClass = 'text-red-700';
                    icon = 'warning';
                } else if (r.relation_type === 'reconciled') {
                    relColorClass = 'border-blue-300 bg-white';
                    headerBgClass = 'bg-blue-50 border-blue-200';
                    textColorClass = 'text-blue-700';
                    icon = 'handshake';
                }

                let contextHtml = '';
                if (r.relation_type === 'reconciled' && r.explanation) {
                    contextHtml = `
                    <div class="px-4 py-3 border-b border-border bg-blue-50/30">
                        <div class="flex items-start gap-2 text-xs font-body text-slate-800">
                            <span class="material-symbols-outlined text-blue-600 text-[16px] mt-0.5">info</span>
                            <div>
                                <span class="font-bold text-blue-900">Contextual Reconciliation:</span>
                                <span class="italic opacity-90">${r.explanation}</span>
                            </div>
                        </div>
                    </div>`;
                }

                list.innerHTML += `
                    <div class="border ${relColorClass} rounded-lg overflow-hidden flex flex-col">
                        <div class="${headerBgClass} border-b px-4 py-2 flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined ${textColorClass} text-[16px]">${icon}</span>
                                <span class="font-label text-[11px] font-bold ${textColorClass} uppercase tracking-wider">${r.relation_type}</span>
                            </div>
                            <span class="text-[10px] text-slate-500 font-mono">ID: ${r.id.split('-')[0]}</span>
                        </div>
                        ${contextHtml}
                        <div class="grid grid-cols-2 divide-x divide-border">
                            <div class="p-4 flex flex-col bg-white">
                                ${renderFactBlock(fA, 'Fact A')}
                            </div>
                            <div class="p-4 flex flex-col bg-white">
                                ${renderFactBlock(fB, 'Fact B')}
                            </div>
                        </div>
                    </div>
                `;
            });

            // Load Failures
            const resFail = await fetch('/api/failures');
            const dataFail = await resFail.json();
            const failsList = document.getElementById('failuresList');
            failsList.innerHTML = '';
            document.getElementById('failCount').innerText = `${dataFail.failures.length} Items`;

            dataFail.failures.forEach(f => {
                failsList.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-2.5 px-4 font-mono text-[10px] font-medium text-slate-700">${f.filename}</td>
                        <td class="py-2.5 px-4 font-semibold text-slate-900">${f.page}</td>
                        <td class="py-2.5 px-4">
                            <span class="bg-slate-100 border border-slate-200 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded tracking-wide uppercase">
                                ${f.reason}
                            </span>
                        </td>
                    </tr>
                `;
            });

        } catch (e) { console.error('Failed to load data', e); }
    }

    function renderFactBlock(f, label) {
        let valueColor = 'text-slate-900 bg-slate-100';
        return `
            <div class="mb-3">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[10px] text-slate-500 uppercase font-label font-bold tracking-wider">${label}</span>
                    <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded border border-slate-200 bg-slate-50 text-slate-600">${f.evidence_type}</span>
                </div>
                <div class="font-body text-[13px] text-slate-800 leading-relaxed border-l-2 border-slate-300 pl-3">
                    <div class="truncate" title="${f.entity}"><span class="text-slate-500">Entity:</span> <span class="font-semibold">${f.entity}</span></div>
                    <div class="truncate" title="${f.attribute}"><span class="text-slate-500">Attribute:</span> <span class="font-semibold">${f.attribute}</span></div>
                    <div class="mt-1">
                        <span class="text-slate-500">Value:</span> 
                        <span class="font-bold text-[14px] ${valueColor} px-1.5 py-0.5 rounded shadow-sm border border-slate-200">${f.value}</span> 
                        <span class="font-semibold text-slate-600 ml-1">${f.unit}</span>
                    </div>
                </div>
            </div>
            <div class="mt-auto pt-3">
                <div class="bg-yellow-50/50 border border-yellow-200/60 p-3 text-xs font-body text-slate-800 rounded shadow-sm">
                    <div class="text-[9px] font-label font-bold text-yellow-800/80 mb-1.5 flex items-center gap-1 uppercase tracking-wider">
                        <span class="material-symbols-outlined text-[12px]">format_quote</span> Evidence Grounding
                    </div>
                    <p class="italic leading-snug break-words">"${f.source_quote || 'Structured table grid evidence. View source doc for visual layout.'}"</p>
                    <div class="mt-2 text-[10px] text-slate-500 font-mono text-right font-medium">Chunk ID: ${f.chunk_id.split('__')[0]}</div>
                </div>
            </div>
        `;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) return alert('Select a PDF');

        const btn = document.getElementById('uploadBtn');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');

        const statusBox = document.getElementById('jobStatusContainer');
        const docName = document.getElementById('jobDocName');
        const statusText = document.getElementById('jobStatusText');
        const progressBar = document.getElementById('jobProgressBar');

        docName.innerText = fileInput.files[0].name;
        statusText.innerText = 'Initializing...';
        progressBar.style.width = '10%';
        progressBar.className = 'bg-indigo-500 h-1.5 rounded-full w-[10%] animate-pulse';
        statusBox.classList.remove('hidden');

        try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.job_id) {
                statusText.innerText = 'Extracting Facts...';
                progressBar.style.width = '50%';
                
                const interval = setInterval(async () => {
                    const jRes = await fetch(`/api/job/${data.job_id}`);
                    const jData = await jRes.json();
                    
                    if (jData.status === 'completed' || data.message === "Document already ingested or processing") {
                        clearInterval(interval);
                        statusText.innerText = 'Complete';
                        progressBar.style.width = '100%';
                        progressBar.classList.remove('bg-indigo-500', 'animate-pulse');
                        progressBar.classList.add('bg-green-500');
                        btn.disabled = false;
                        btn.classList.remove('opacity-50', 'cursor-not-allowed');
                        loadData();
                    } else if (jData.status === 'failed') {
                        clearInterval(interval);
                        statusText.innerText = 'Failed';
                        progressBar.style.width = '100%';
                        progressBar.classList.remove('bg-indigo-500', 'animate-pulse');
                        progressBar.classList.add('bg-red-500');
                        btn.disabled = false;
                        btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }, 2000);
            }
        } catch (err) {
            statusText.innerText = 'Error: ' + err.message;
            progressBar.classList.add('bg-red-500');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    });

    // Initial load
    loadData();
</script>
</body>
</html>
